<script>


(function () {
  function show(msg) {
    try {
      var r = document.getElementById('root');
      if (!r) return;
      if (r.innerHTML.length > 200) return;   
      r.innerHTML =
        '<div style="padding:40px 22px;text-align:center;font-family:-apple-system,' +
        'BlinkMacSystemFont,sans-serif;color:#2c2c2f">' +
        '<div style="font-size:34px;margin-bottom:12px">⚠️</div>' +
        '<div style="font-size:15px;font-weight:700;margin-bottom:10px">頁面載入失敗</div>' +
        '<div style="font-size:11.5px;color:#a0907a;line-height:1.8;word-break:break-all;' +
        'text-align:left;background:#f4f1ee;border-radius:10px;padding:12px">' +
        String(msg).replace(/[&<>]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
        }) + '</div>' +
        '<button onclick="location.reload()" style="margin-top:18px;font-size:13.5px;' +
        'padding:10px 22px;border-radius:10px;border:0;background:#795238;color:#fff;' +
        'font-weight:700">重新載入</button></div>';
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    show((e.message || '未知錯誤') + '\n' +
         (e.filename ? e.filename.split('/').pop() : '') +
         (e.lineno ? ' 第 ' + e.lineno + ' 行' : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('Promise 未處理：' + (r && r.message ? r.message : String(r)));
  });
})();
</script>

<script>



var GAS_URL = 'https://script.google.com/macros/s/AKfycbxokzn1g38p3jcYpT5K-6bXyj4A-5BdiflcfSng-dFv34Vpa1SXkXHgQQLKiuuEnVza/exec';
var LIFF_ID = '2009208139-8lZaYbbd';
var SERVICE_URL = 'https://lin.ee/mty4uxj';
var DEPOSIT = 20;            
var LOW_STOCK = 5;           
var CART_KEY = 'we_shop_cart';
var SNAP_KEY = 'we_shop_snapshot';   

var view = 'list';           
var me = null;               
var meLoading = false;
var groups = [];             
var announcement = '';
var myOrders = null;         
var cart = {};               
var activeBrand = '';        
var brands = [];             
var lastOrder = null;        
var payInfo = null;          
var payDone = false;         
var payDays = 5;             
var loadErr = '';
var loadDetail = '';         
var submitting = false;      
var productsLoading = false; 
var selSize = {};            
var cardQty = {};            
var _stash = [];             



var stale = false;           



function saveSnapshot() {
  try {
    localStorage.setItem(SNAP_KEY, JSON.stringify({
      at: Date.now(), groups: groups, announcement: announcement
    }));
  } catch (e) {}
}

 
function loadSnapshot() {
  try {
    var s = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if (!s || !s.groups || !s.groups.length) return false;
    if (Date.now() - (s.at || 0) > 6 * 3600 * 1000) return false;   
    groups = s.groups;
    brands = uniqueBrands(groups);
    announcement = s.announcement || '';
    stale = true;
    return true;
  } catch (e) { return false; }
}

 



(function () {
  loadCart();
  
  
  loadSnapshot();
  draw();

  var early = null;
  try { early = localStorage.getItem('we_uid'); } catch (e) {}

  
  
  if (early) start(early);

  if (typeof liff === 'undefined') {
    if (!early) start(null);
    return;
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (autoLoginIfNeeded()) return;
    if (!liff.isLoggedIn()) { if (!early) start(null); return; }

    return liff.getProfile().then(function (p) {
      try { localStorage.setItem('we_uid', p.userId); } catch (e) {}
      if (early === p.userId) {
        
        me = me || {};
        me.uid = p.userId;
        return;
      }
      start(p.userId);
    });
  }).catch(function (e) {
    console.error('LIFF 初始化失敗：', e);
    if (!early) start(null);
  });
})();



function start(uid) {
  if (uid) {
    me = me || {};
    me.uid = uid;          
    meLoading = true;
  } else {
    meLoading = false;
  }
  draw();
  
  
  loadProducts(uid, 0);
}



function autoLoginIfNeeded() {
  if (typeof liff === 'undefined') return false;
  try { if (liff.isLoggedIn()) return false; } catch (e) { return false; }
  if (location.search.indexOf('we_login=1') >= 0) return false;   
  if (!/\bLine\//i.test(navigator.userAgent)) return false;

  try {
    document.documentElement.style.background = '#efe8df';
    document.body.style.visibility = 'hidden';
  } catch (e) {}
  var q = location.search ? location.search + '&we_login=1' : '?we_login=1';
  liff.login({ redirectUri: location.origin + location.pathname + q });
  return true;
}

 

 
function retryLoad() {
  loadErr = '';
  loadDetail = '';
  groups = [];
  productsLoading = false;   
  draw();
  var uid = null;
  try { uid = (me && me.uid) || localStorage.getItem('we_uid'); } catch (e) {}
  loadProducts(uid, 0);
}



function loadAll(uid) {
  loadProducts(uid, 0);
}



function loadProducts(uid, tries, done) {
  
  
  
  
  
  if (tries === 0 && productsLoading) {
    if (done) done();
    return;
  }
  productsLoading = true;

  tries = tries || 0;
  var startedAt = Date.now();
  
  
  
  
  var u = GAS_URL + '?action=instockPrep' +
          (uid ? '&lineUid=' + encodeURIComponent(uid) : '');

  
  
  fetchJson(u, function (res) {
    var d = (res && res.data) || {};

    
    var pd = d.products || {};
    if (!res || res.status !== 'SUCCESS' || pd.failed) {
      
      
      
      
      if (groups.length) {
        stale = true;
        loadErr = '';
        loadDetail = '';
      } else {
        loadErr = pd.message || (res && res.message) || '商品載入失敗';
      }
      productsLoading = false;
      draw();
      if (done) done();
      return;
    }
    groups = sortGroups(pd.groups || []);
    brands = uniqueBrands(groups);

    
    
    
    var st = d.settings || {};
    announcement = st.announcement || pd.announcement || '';
    if (st.paymentDays > 0) payDays = st.paymentDays;
    if (st.paymentInfo) { payInfo = st.paymentInfo; payDone = true; }
    else if (st.failed !== true) { payDone = true; }

    
    var od = d.orders;
    if (od) {
      meLoading = false;
      me = me || {};
      if (uid) me.uid = uid;
      if (od.unbound) {
        me.bound = false;
        myOrders = { orders: [], pendingCount: 0, pendingQty: 0, pendingDue: 0 };
      } else if (od.failed) {
        me.failed = true;
      } else {
        myOrders = od;
        if (od.me) {
          me.name = od.me.name || '';
          me.phone = od.me.phone || '';
          me.bound = true;
        }
        var last = (od.orders || []).filter(function (x) { return x.last5; })[0];
        if (last) me.last5 = last.last5;
      }
    } else if (uid) {
      meLoading = false;
    }

    loadErr = '';
    loadDetail = '';
    stale = false;
    saveSnapshot();
    productsLoading = false;
    console.log('賣場載入 ' + (Date.now() - startedAt) + ' ms（一支拿齊）');
    draw();
    if (done) done();
  }, function (why) {
    
    
    var isNet = (why === 'timeout' || String(why).indexOf('network') === 0);
    if (isNet && tries < 2) {
      loadErr = '';
      loadDetail = '連線較慢，重試中…（' + (tries + 1) + '/2）';
      draw();
      setTimeout(function () { loadProducts(uid, tries + 1, done); }, 700);
      return;   
    }

    
    
    
    
    
    if (groups.length) {
      loadErr = '';
      loadDetail = '';
      stale = true;
      productsLoading = false;
      draw();
      if (done) done();
      return;
    }

    loadErr = (why === 'timeout') ? '伺服器回應太慢'
            : (why === 'badjson') ? '伺服器回應格式不正確'
            : (String(why).indexOf('render:') === 0) ? '畫面顯示發生問題'
            : '連線失敗';
    
    
    loadDetail = String(why || '') + '　等了 ' +
      Math.round((Date.now() - startedAt) / 100) / 10 + ' 秒' +
      (tries ? '（已重試 ' + tries + ' 次）' : '');
    productsLoading = false;
    draw();
    if (done) done();   
  }, tries === 0 ? 20000 : 12000);
}

function fetchJson(url, ok, fail, ms) {
  var over = false;
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var t = setTimeout(function () {
    over = true;
    if (ctrl) ctrl.abort();
    fail && fail('timeout');
  }, ms || 12000);

  
  
  
  var p;
  try {
    p = fetch(url, ctrl ? { signal: ctrl.signal } : {});
  } catch (e) {
    console.warn('fetch 不支援 signal，改用一般請求：', e.message);
    ctrl = null;
    p = fetch(url);
  }

  p.then(function (r) { return r.text(); })
    .then(function (raw) {
      if (over) return;
      clearTimeout(t);

      var data;
      try { data = JSON.parse(raw); }
      catch (e) {
        
        
        console.error('回應不是 JSON：', raw.substring(0, 200));
        fail && fail('badjson');
        return;
      }

      try { ok(data); }
      catch (e) {
        console.error('處理回應時發生錯誤：', e);
        fail && fail('render:' + e.message);
      }
    })
    .catch(function (e) {
      if (over) return;
      clearTimeout(t);
      console.error('請求失敗：', e);
      
      
      fail && fail('network:' + (e && e.message ? e.message.substring(0, 60) : ''));
    });
}

 

function loadCart() {

function cartQty() {
  return Object.keys(cart).reduce(function (s, k) { return s + cart[k].qty; }, 0);
}
function cartSum() {
  return Object.keys(cart).reduce(function (s, k) {
    return s + cart[k].qty * cart[k].price;
  }, 0);
}



function sortGroups(gs) {
  var order = {};   
  gs.forEach(function (g, i) {
    var b = brandOf(g.category);
    if (order[b] == null) order[b] = i;
  });
  var out = gs.slice();
  out.sort(function (a, b) {
    var ba = brandOf(a.category), bb = brandOf(b.category);
    if (ba !== bb) return order[ba] - order[bb];
    return cmpName(a.category, b.category);   
  });
  
  out.forEach(function (g) {
    (g.items || []).sort(function (x, y) { return cmpName(x.name, y.name); });
  });
  return out;
}

 
function brandOf(cat) {
  var i = String(cat).indexOf(' / ');
  return i > 0 ? String(cat).substring(0, i) : String(cat);
}

function uniqueBrands(gs) {
  var seen = {}, out = [];
  gs.forEach(function (g) {
    var b = brandOf(g.category);
    if (!seen[b]) { seen[b] = true; out.push(b); }
  });
  return out;
}



function cmpName(a, b) {
  var ea = /^[A-Za-z0-9]/.test(String(a));
  var eb = /^[A-Za-z0-9]/.test(String(b));
  if (ea !== eb) return ea ? -1 : 1;
  return String(a).localeCompare(String(b), 'zh-Hant');
}

function chQty(k, d) {
  var id = unq(k);
  var n = (cardQty[id] || 1) + d;
  var c = findCard(id);
  var max = 99;
  if (c) {
    var s = (c.sizes.length === 1 && isBlankSize(c.sizes[0].size))
      ? c.sizes[0] : c.sizes[selSize[id]];
    if (s) max = s.remain;
  }
  cardQty[id] = Math.max(1, Math.min(max || 1, n));
  draw();
}
function findCard(id) {
  for (var i = 0; i < groups.length; i++) {
    var f = (groups[i].items || []).filter(function (c) { return c.styleKey === id; });
    if (f.length) return f[0];
  }
  return null;
}

function addCart(k) {
  var id = unq(k);
  var c = findCard(id);
  if (!c) return;
  
  
  var noSize = (c.sizes.length === 1 && isBlankSize(c.sizes[0].size));
  var s = noSize ? c.sizes[0] : c.sizes[selSize[id]];
  if (!s || s.remain <= 0) return;

  var want = cardQty[id] || 1;
  var cur = cart[s.inventoryId] ? cart[s.inventoryId].qty : 0;

  
  
  if (cur + want > s.remain) {
    alert('「' + c.name + (isBlankSize(s.size) ? '' : ' ' + s.size) + '」只剩 ' + s.remain +
          ' 件，你的購物車裡已經有 ' + cur + ' 件。');
    return;
  }

  cart[s.inventoryId] = {
    qty: cur + want,
    name: c.name,
    size: isBlankSize(s.size) ? '' : s.size,
    price: s.effectivePrice,
    max: s.remain,
    photo: (c.photos && c.photos[0]) || ''
  };
  saveCart();
  cardQty[id] = 1;
  selSize[id] = null;
  draw();
}

  var it = cart[k];

  if (n <= 0) { delete cart[k]; }
  else if (n > it.max) { alert('這個品項只剩 ' + it.max + ' 件。'); return; }
  else it.qty = n;
  saveCart();
  draw();
}

function submitOrder() {
  
  
  
  
  
  if (submitting) return;

  var last5 = (document.getElementById('fLast5') || {}).value || '';
  last5 = last5.trim();
  if (!/^\d{4,5}$/.test(last5)) { alert('請填匯款帳號後五碼。'); return; }

  var uid = (me && me.uid) || null;
  try { uid = uid || localStorage.getItem('we_uid'); } catch (e) {}
  if (!uid) { alert('請先在 LINE 裡開啟賣場，才能送出訂單。'); return; }

  
  
  if (me && me.bound === false) {
    alert('你還沒有完成會員綁定，無法送出訂單。\n\n請先到會員中心完成綁定。');
    return;
  }

  var items = Object.keys(cart).map(function (k) {
    return { inventoryId: k, qty: cart[k].qty };
  });
  if (!items.length) return;

  
  
  
  
  submitting = true;
  
  
  setSubmitLabel('送出中…');

  
  
  
  
  
  
  
  var sentAt = Date.now();
  var before = myOrders ? (myOrders.orders || []).length : 0;
  var over = false;
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  
  
  
  
  
  var timer = setTimeout(function () {
    over = true;
    if (ctrl) ctrl.abort();
    
    
    
    
    setTimeout(function () { verifyAfterTimeout(uid, before, last5, 0); }, 3000);
  }, 35000);

  var opt = {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      action: 'instockCheckout',
      payload: JSON.stringify({ lineUid: uid, cartItems: items, last5: last5 })
    })
  };
  if (ctrl) opt.signal = ctrl.signal;

  var req;
  try { req = fetch(GAS_URL, opt); }
  catch (e) {
    
    delete opt.signal;
    ctrl = null;
    req = fetch(GAS_URL, opt);
  }

  req.then(function (r) { return r.text(); })
    .then(function (raw) {
      if (over) return;
      clearTimeout(timer);

      var d;
      try { d = JSON.parse(raw); }
      catch (e) {
        submitting = false;
        alert('伺服器回應格式不正確，訂單可能沒有成立。\n請到「我的訂單」確認。');
        go('orders'); loadOrders(uid); return;
      }

      if (d.status === 'STOCK_INSUFFICIENT') {
        submitting = false;
        showGone(d.failedItems || []);
        return;
      }
      if (d.status === 'BUSY') {
        
        submitting = false;
        alert(d.message || '結帳人潮眾多，請稍候幾秒再送出一次。');
        draw();
        return;
      }
      if (d.status !== 'SUCCESS') {
        submitting = false;
        alert(d.message || '送出失敗，請稍後再試。');
        draw();
        return;
      }

      console.log('現貨結帳 ' + (Date.now() - sentAt) + ' ms（客人實際等待）',
                  d.lap ? JSON.stringify(d.lap) : '');

      lastOrder = {
        orderNo: d.orderNo || '',
        at: new Date().toISOString(),
        items: Object.keys(cart).map(function (k) { return cart[k]; }),
        qty: d.qty || cartQty(),
        subtotal: d.thisSubtotal || cartSum(),
        deposit: d.deposit || 0,
        due: d.dueAmount || 0,
        last5: last5
      };
      submitting = false;
      cart = {};
      saveCart();
      loadPayInfo();
      loadOrders(uid);
      go('done');
    })
    .catch(function () {
      if (over) return;
      clearTimeout(timer);
      submitting = false;
      alert('網路異常，訂單沒有送出。請確認網路後重試。');
      draw();
    });
}



function verifyAfterTimeout(uid, before, last5, tries) {
  tries = tries || 0;
  setSubmitLabel(tries ? '確認中…(' + (tries + 1) + '/3)' : '確認中…');

  fetchJson(GAS_URL + '?action=getMyInstockOrders&lineUid=' + encodeURIComponent(uid),
    function (res) {
      var list = (res && res.data && res.data.orders) || [];

      
      
      
      
      
      if (res && res.status === 'SUCCESS' && list.length <= before && tries < 2) {
        setTimeout(function () {
          verifyAfterTimeout(uid, before, last5, tries + 1);
        }, 4000);
        return;
      }

      if (res && res.status === 'SUCCESS' && list.length > before) {
        
        myOrders = res.data;
        var o = list[0];   
        lastOrder = {
          orderNo: o.orderNo || '',
          at: o.createdAt || new Date().toISOString(),
          items: (o.items || []).map(function (it) {
            return { name: it.name, size: it.size, qty: it.qty, price: it.price };
          }),
          qty: o.itemCount || 0,
          subtotal: o.subtotal || 0,
          deposit: o.deposit || 0,
          due: o.dueAmount || 0,
          last5: last5
        };
        submitting = false;
        cart = {};
        saveCart();
        loadPayInfo();
        go('done');
        return;
      }

      submitting = false;
      alert('網路不穩，訂單沒有送出。\n購物車保留著，請再按一次送出訂單。');
      draw();
    },
    function (why) {
      
      
      if (tries < 2) {
        setTimeout(function () {
          verifyAfterTimeout(uid, before, last5, tries + 1);
        }, 4000);
        return;
      }
      
      
      submitting = false;
      alert('無法確認訂單狀態。\n\n請到「我的訂單」查看是否已經成立，避免重複下單。');
      go('orders');
      loadOrders(uid);
    });
}



function showGone(failed) {
  var lines = failed.map(function (f) {
    var it = cart[f.inventoryId];
    var nm = it ? (it.name + (it.size ? ' ' + it.size : '')) : (f.name || '某個品項');
    return '　' + nm + '　你要 ' + (f.want || (it && it.qty) || 0) +
           ' 件，剩 ' + (f.remain != null ? f.remain : 0) + ' 件';
  }).join('\n');

  alert('有品項被搶走了，這一單沒有成立：\n\n' + lines +
        '\n\n購物車保留著，調整數量後可以再送一次。');

  
  failed.forEach(function (f) {
    if (cart[f.inventoryId]) {
      cart[f.inventoryId].max = f.remain != null ? f.remain : 0;
      if (cart[f.inventoryId].qty > cart[f.inventoryId].max) {
        cart[f.inventoryId].qty = cart[f.inventoryId].max;
      }
      if (cart[f.inventoryId].qty <= 0) delete cart[f.inventoryId];
    }
  });
  saveCart();
  productsLoading = false;
  loadProducts((me && me.uid) || null, 0);
  draw();
}



function loadPayInfo() {
  if (payInfo) { payDone = true; draw(); return; }

  fetchJson(GAS_URL + '?action=getInstockBatchInfo',
    function (res) {
      payDone = true;
      if (res && res.status === 'SUCCESS' && res.data) {
        payInfo = res.data.paymentInfo || null;
        if (res.data.paymentDays > 0) payDays = res.data.paymentDays;
      }
      draw();
    },
    function () {
      
      payDone = true;
      draw();
    });
}

 

function viewDone() {
  var r = lastOrder || {};
  var h = '<div class="okp"><div class="ic"><i class="bi bi-check-circle-fill"></i></div>' +
    '<h2>訂單已送出</h2><p>庫存已為你保留</p></div>';

  h += '<div class="sec" style="padding-top:0">';
  h += '<div class="box"><div class="rows2">' +
    (r.orderNo ? '<div class="r"><span>訂單編號</span><span class="no">' +
                 esc(r.orderNo) + '</span></div>' : '') +
    '<div class="r"><span>下單時間</span><span>' + esc(fmtWhen(r.at)) + '</span></div>' +
    '<div class="r"><span>訂購內容</span><span class="itemlines">' +
      itemsLines(r.items) + '</span></div>' +
    '<div class="r"><span>應匯金額</span><span class="red">NT$' +
      (r.due || 0).toLocaleString() + '</span></div>' +
    '</div></div>';

  h += payBlock(r.due || 0);

  h += '<div style="display:flex;gap:9px;padding:4px 0 18px">' +
    '<button class="tab" style="flex:1;padding:12px;border-radius:11px;font-size:13.5px;' +
    'font-weight:700" onclick="goList()">繼續購物</button>' +
    '<button class="tab" style="flex:1;padding:12px;border-radius:11px;font-size:13.5px;' +
    'font-weight:800;background:var(--brown);border-color:var(--brown);color:#fff" ' +
    'onclick="goOrders()">我的訂單</button></div>';

  return h + '</div>';
}



function payBlock(due) {
  var note = '<div class="paynote">' +
    '請於 <b>' + esc(payBy()) + '</b> 前完成匯款。<br>' +
    '現在不方便匯款的話，之後到<b>會員中心</b>也看得到匯款資訊。</div>';

  if (payInfo) {
    
    
    
    
    
    
    var lines = String(payInfo).split(/\r?\n/)
      .map(function (x) { return x.trim(); }).filter(Boolean);

    return '<div class="pay"><h4>請匯款至以下帳戶</h4>' +
      '<div class="accbox">' + lines.map(function (x) {
        return '<div class="accline">' + esc(x) + '</div>';
      }).join('') + '</div>' +
      (due ? '<div class="r due"><span>應匯金額</span>' +
             '<span class="amt">NT$' + due.toLocaleString() + '</span></div>' : '') +
      note + '</div>';
  }

  if (payDone) {
    
    
    return '<div class="pay"><h4>匯款資訊</h4>' +
      '<div class="r"><span>請至會員中心查看匯款帳戶</span></div>' +
      note + '</div>';
  }

  return '<div class="pay"><h4>匯款資訊</h4>' +
    '<div class="r"><span class="ld"></span>' +
    '<span style="flex:1;text-align:right">讀取收款資訊中…</span></div>' + note + '</div>';
}



function payBy() {
  var base = (lastOrder && lastOrder.at) ? new Date(lastOrder.at) : new Date();
  if (isNaN(base)) base = new Date();

  
  
  
  
  var tw = new Date(base.getTime() + payDays * 86400000 + 8 * 3600 * 1000);
  if (tw.getUTCMinutes() > 0 || tw.getUTCSeconds() > 0) {
    tw.setUTCHours(tw.getUTCHours() + 1);
  }
  tw.setUTCMinutes(0, 0, 0);

  var wk = ['日', '一', '二', '三', '四', '五', '六'][tw.getUTCDay()];
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return (tw.getUTCMonth() + 1) + '/' + tw.getUTCDate() +
         '（' + wk + '）' + p(tw.getUTCHours()) + ':00';
}

 

function viewOrders() {
  var h = hdrBack('我的訂單');

  if (meLoading || !myOrders) {
    return h + '<div class="empty"><span class="ld"></span>' +
      '<div style="margin-top:10px">讀取訂單中…</div></div>';
  }

  var list = myOrders.orders || [];
  if (!list.length) {
    return h + '<div class="empty"><i class="bi bi-receipt"></i>目前沒有訂單' +
      '<div style="margin-top:14px"><button class="tab" onclick="goList()">' +
      '去逛逛</button></div></div>';
  }

  
  
  if (myOrders.pendingCount > 1) {
    h += '<div class="tip"><i class="bi bi-lightbulb-fill"></i>' +
      '<p>' + myOrders.pendingCount + ' 筆訂單可以<b>加總 NT$' +
      (myOrders.pendingDue || 0).toLocaleString() + ' 一次匯款</b>，' +
      '也可以分開匯。後五碼填同一組即可。</p></div>';
  }

  h += '<div class="sec" style="padding-top:0">';
  list.forEach(function (o) {
    h += '<div class="od"' + (o.paid ? ' style="opacity:.75"' : '') + '>' +
      '<div class="oh"><span class="no">' + esc(o.orderNo || '（處理中）') + '</span>' +
      (o.paid ? '' : '<span class="tag wait">待匯款</span>') + '</div>' +
      '<div class="ob">';

    (o.items || []).forEach(function (it) {
      h += '<div class="ln"><span class="n">' + esc(it.name) +
        (isBlankSize(it.size) ? '' : ' ' + esc(it.size)) + '</span>' +
        '<span class="q">×' + it.qty + '</span>' +
        '<span class="a">' + (it.qty * it.price).toLocaleString() + '</span></div>';
    });

    h += '<div class="of"><span class="lb">' + esc(fmtWhen(o.createdAt)) + ' 下單' +
      (o.deposit ? '<br>已扣尾款 ' + o.deposit : '') +
      (o.last5 ? '<br>後五碼 ' + esc(o.last5) : '') +
      '</span><span class="am">NT$' + (o.dueAmount || 0).toLocaleString() + '</span></div>';

    h += '</div></div>';
  });
  h += '</div>';

  h += '<div style="padding:0 16px 20px"><button class="tab" style="width:100%;' +
    'padding:12px;border-radius:11px;font-size:13.5px;font-weight:700" ' +
    'onclick="goList()">繼續購物</button></div>';
  return h;
}

 

var lbImgs = [];
var shopScale = 1;



function shopZoom(dir) {
  var steps = [1, 1.5, 2, 3, 4];
  var i = steps.indexOf(shopScale);
  if (i < 0) i = 0;
  i = Math.max(0, Math.min(steps.length - 1, i + dir));
  shopApplyScale(steps[i]);
}

function shopApplyScale(s) {
  shopScale = s;
  var w = document.getElementById('lbWrap');
  if (!w) return;
  Array.prototype.forEach.call(w.querySelectorAll('img'), function (img) {
    img.style.transform = 'scale(' + s + ')';
  });
  
  w.classList.toggle('zoomed', s > 1);
  var lvl = document.getElementById('lbLvl');
  if (lvl) lvl.textContent = Math.round(s * 100) + '%';
}

function shopToggleZoom() { shopApplyScale(shopScale > 1 ? 1 : 2); }

 
(function shopPinch() {
  var w = document.getElementById('lbWrap');
  if (!w) return;
  var d0 = 0, s0 = 1;
  var dist = function (t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  };
  w.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 2) return;
    d0 = dist(e.touches); s0 = shopScale;
  }, { passive: true });
  w.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2 || !d0) return;
    e.preventDefault();
    shopApplyScale(Math.max(1, Math.min(5, s0 * (dist(e.touches) / d0))));
  }, { passive: false });
  w.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) d0 = 0;
    if (shopScale < 1.1 && shopScale !== 1) shopApplyScale(1);
  }, { passive: true });
})();

function openLb(k) {
  lbImgs = (unq(k) || []).filter(Boolean);
  if (!lbImgs.length) return;

  document.getElementById('lbWrap').innerHTML =
    lbImgs.map(function (u) {
      return '<img src="' + esc(u) + '" alt="" ondblclick="shopToggleZoom()">';
    }).join('');
  shopApplyScale(1);   
  document.getElementById('lbDots').innerHTML =
    lbImgs.length > 1 ? lbImgs.map(function (_, i) {
      return '<i class="' + (i === 0 ? 'on' : '') + '"></i>';
    }).join('') : '';
  document.getElementById('lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLb() {
  shopApplyScale(1);   
  document.getElementById('lb').classList.remove('on');
  document.body.style.overflow = '';
}
function lbScroll() {
  var w = document.getElementById('lbWrap');
  var i = Math.round(w.scrollLeft / w.clientWidth);
  var dots = document.getElementById('lbDots').children;
  for (var k = 0; k < dots.length; k++) dots[k].className = (k === i ? 'on' : '');
}

 

 
function isBlankSize(s) {
  var v = String(s == null ? '' : s).trim();
  return v === '' || v === '-' || v === '－';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}


function q(v) {
  _stash.push(v);
  return (_stash.length - 1);
}
function unq(i) { return _stash[i]; }
function fmtWhen(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
 
function itemsLines(items) {
  if (!items || !items.length) return '';
  return items.map(function (it) {
    return '<i>' + esc(it.name + (isBlankSize(it.size) ? '' : ' ' + it.size) +
      ' ×' + it.qty) + '</i>';
  }).join('');
}

function itemsText(items) {
  if (!items || !items.length) return '';
  if (items.length <= 2) {
    return items.map(function (it) {
      return it.name + (isBlankSize(it.size) ? '' : ' ' + it.size) + ' ×' + it.qty;
    }).join('、');
  }
  var n = items.reduce(function (s, it) { return s + it.qty; }, 0);
  return items.length + ' 個品項，共 ' + n + ' 件';
}
