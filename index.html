<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Wander Ease</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{
  --bg:#efe8df; --ink:#2c2c2f; --brown:#795238; --brown-hi:#5e3f2b;
  --white:#fff; --line:#e0d8d0; --mute:#a0907a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light only}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:600px;margin:0 auto}

.hero{
  background:var(--ink);color:var(--white);padding:30px 22px 34px;
  border-radius:0 0 22px 22px;box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.hero .bd{font-size:11.5px;letter-spacing:.18em;opacity:.65}
.hero h1{font-size:25px;font-weight:800;margin:6px 0 0;letter-spacing:.02em}
.hero .who{font-size:13px;opacity:.8;margin-top:7px;min-height:20px;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;
     animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}

.tiles{padding:18px 18px 6px;display:grid;gap:12px}
.tile{
  display:flex;align-items:center;gap:14px;padding:17px 18px;background:var(--white);
  border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;
  box-shadow:0 4px 14px rgba(44,44,47,.04);transition:transform .12s,box-shadow .12s;
  -webkit-tap-highlight-color:transparent;
}
.tile:active{transform:scale(.985);box-shadow:0 2px 8px rgba(44,44,47,.06)}
.tile .ic{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:21px;
}
.tile .tx{flex:1;min-width:0}
.tile .tx b{display:block;font-size:16.5px;font-weight:800;letter-spacing:.01em}
.tile .tx s{display:block;font-size:12.5px;color:var(--mute);text-decoration:none;margin-top:2px}
.tile .cnt{
  background:var(--brown);color:var(--white);font-size:12px;font-weight:800;
  min-width:24px;height:24px;border-radius:12px;display:none;
  align-items:center;justify-content:center;padding:0 8px;
}
.tile .cnt.on{display:flex}
.tile .ar{color:#c9bfb4;font-size:15px}

.sec{padding:14px 18px 0}
.sec h3{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em;margin-bottom:9px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:15px 17px;
       font-size:13.5px;color:#4a4038;white-space:pre-wrap}
 
.maint{min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:40px 28px;text-align:center}
.maint .ic{font-size:44px;color:var(--brown);margin-bottom:14px}
.maint h2{font-size:20px;font-weight:800;margin-bottom:10px}
.maint p{font-size:14px;color:#5b4d40;line-height:1.8;white-space:pre-wrap;max-width:340px}
.foot{text-align:center;font-size:11.5px;color:var(--mute);padding:26px 0 10px}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="bd">WANDER EASE</div>
    <h1>歡迎回來</h1>
    <div class="who" id="who"><span class="dot"></span>辨識中…</div>
  </div>

  <div class="tiles">
    <a class="tile" href="/c">
      <div class="ic" style="background:#efe4d8;color:#795238"><i class="bi bi-megaphone-fill"></i></div>
      <div class="tx"><b>開團預購</b><s id="cSub">泰國選物，跟團下單</s></div>
      <span class="cnt" id="cCnt">0</span>
      <i class="bi bi-chevron-right ar"></i>
    </a>

    <a class="tile" href="/s">
      <div class="ic" style="background:#e6e9e0;color:#5a6b46"><i class="bi bi-bag-fill"></i></div>
      <div class="tx"><b>現貨賣場</b><s>現貨即買，付款後安排出貨</s></div>
      <i class="bi bi-chevron-right ar"></i>
    </a>

    <a class="tile" href="/m">
      <div class="ic" style="background:#e4e6ef;color:#4a5678"><i class="bi bi-person-fill"></i></div>
      <div class="tx"><b>會員中心</b><s>訂單、匯款與出貨進度</s></div>
      <i class="bi bi-chevron-right ar"></i>
    </a>
  </div>

  <div class="sec" id="noticeSec" style="display:none">
    <h3>公告</h3>
    <div class="panel" id="notice"></div>
  </div>

  <div class="foot">Wander Ease · 泰國選物代購</div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>



var LIFF_ID = "2009208139-8lZaYbbd";



function liffRedirectIfNeeded() {
  var s = location.search;
  if (s.indexOf('we_liff=1') >= 0) return false;      
  if (s.indexOf('liff.state') >= 0) return false;     
  if (typeof liff === 'undefined') return false;
  try { if (liff.isInClient()) return false; } catch (e) { return false; }
  if (!/\bLine\//i.test(navigator.userAgent)) return false;

  
  try {
    document.documentElement.style.background = '#efe8df';
    if (document.body) document.body.style.visibility = 'hidden';
  } catch (e) {}

  var q = s ? s + '&we_liff=1' : '?we_liff=1';
  location.replace('https://liff.line.me/' + LIFF_ID + location.pathname + q);
  return true;
}
var GAS_URL = "https://script.google.com/macros/s/AKfycbxokzn1g38p3jcYpT5K-6bXyj4A-5BdiflcfSng-dFv34Vpa1SXkXHgQQLKiuuEnVza/exec";



function showMaintenance(m) {
  document.body.innerHTML =
    '<div class="maint">' +
    '<div class="ic"><i class="bi bi-tools"></i></div>' +
    '<h2>系統維護中</h2>' +
    '<p>' + String(m && m.message || '系統升級維護中，暫停服務。')
      .replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      }) + '</p></div>';
}

var WE = {
   
  loadCampaigns: function () {
    return fetch('/data/campaigns.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  },

   
  saveMe: function (obj) {
    try { sessionStorage.setItem('we_me', JSON.stringify(obj)); } catch (e) {}
  },
  readMe: function () {
    try { return JSON.parse(sessionStorage.getItem('we_me') || 'null'); } catch (e) { return null; }
  }
};

 
WE.loadCampaigns().then(function (d) {
  if (!d) return;
  
  if (d.maintenance && d.maintenance.on) { showMaintenance(d.maintenance); return; }
  if (!d.campaigns) return;
  var open = d.campaigns.filter(function (c) { return c.state === '開放收單'; });
  if (!open.length) {
    document.getElementById('cSub').textContent = '目前沒有開放中的團';
    return;
  }
  var el = document.getElementById('cCnt');
  el.textContent = open.length;
  el.className = 'cnt on';
  document.getElementById('cSub').textContent = open.length + ' 團開放中';
});

 
(function initIdentity() {
  var who = document.getElementById('who');

  
  var cached = WE.readMe();
  if (cached && cached.name) {
    who.innerHTML = '';
    who.textContent = cached.name + (cached.bound ? ' · 已綁定' : '');
  }

  if (typeof liff === 'undefined') { who.textContent = ''; return; }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (liffRedirectIfNeeded()) return;
    
    if (!liff.isLoggedIn()) {
      if (!cached) who.textContent = '';
      return;
    }
    return liff.getProfile().then(function (p) {
      
      var prev = WE.readMe() || {};
      var me = { uid: p.userId, lineName: p.displayName,
                 name: prev.bound ? prev.name : p.displayName,
                 bound: !!prev.bound, phone: prev.phone || '', email: prev.email || '' };
      WE.saveMe(me);
      who.innerHTML = '';
      who.textContent = p.displayName;
      prefetchMember(me);
    });
  }).catch(function () {
    who.textContent = '';
  });

  

  function prefetchMember(me) {
    fetch(GAS_URL + '?action=getMemberData&lineUid=' + encodeURIComponent(me.uid))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.status !== 'BOUND') return;
        me.bound = true;
        me.name = (d.userData && d.userData['最新社群名稱']) || me.lineName;
        me.phone = (d.userData && d.userData['手機號碼']) || '';
        me.email = (d.userData && d.userData['常用 Email']) || '';
        WE.saveMe(me);
        try { sessionStorage.setItem('we_member', JSON.stringify(d)); } catch (e) {}
        document.getElementById('who').textContent = me.name + ' · 已綁定';
      })
      .catch(function () {});
  }
})();
</script>
</body>
</html>
